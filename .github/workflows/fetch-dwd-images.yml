name: DWD-Karten abrufen

# Taeglich 16:30 Ortszeit Berlin - ein Lauf fuer alle fuenf Karten.
# Das timezone-Feld ist offiziell unterstuetzt (IANA-String); GitHub
# handhabt damit die Sommer-/Winterzeit, ohne dass der Cron-Ausdruck
# zweimal im Jahr angefasst werden muss.
#
# workflow_dispatch bleibt zusaetzlich bestehen: manuelles Ausloesen ueber
# Actions-Tab -> "Run workflow" ist damit weiterhin jederzeit moeglich.
#
# Hinweis: GitHub garantiert die Startzeit nicht - bei hoher Last koennen
# geplante Laeufe verzoegert werden oder einzeln ausfallen.
on:
  schedule:
    - cron: '30 16 * * *'
      timezone: 'Europe/Berlin'
  workflow_dispatch:

# Der Workflow committet die heruntergeladenen Karten zurueck ins Repository,
# dafuer braucht das GITHUB_TOKEN Schreibrechte.
permissions:
  contents: write

# Zwei gleichzeitige Laeufe wuerden beim Pushen kollidieren.
concurrency:
  group: fetch-dwd-images
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Node einrichten
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Abhaengigkeiten installieren
        run: npm ci

      # continue-on-error, damit Teilerfolge unten trotzdem committet werden.
      # Der Lauf wird im letzten Schritt nachtraeglich rot markiert.
      - name: DWD-Karten herunterladen
        id: fetch
        continue-on-error: true
        run: npm run fetch:images

      - name: Neue Karten committen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/images
          if git diff --cached --quiet; then
            echo "Keine neuen Karten - nichts zu committen."
            exit 0
          fi

          anzahl=$(git diff --cached --name-only | wc -l | tr -d ' ')
          git commit -m "data: ${anzahl} DWD-Karte(n) vom $(date -u +%Y-%m-%d)"
          git push
          echo "${anzahl} Datei(en) committet."

      - name: Lauf als fehlgeschlagen markieren, falls Karten fehlten
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "Mindestens eine Karte konnte nicht abgerufen werden - siehe Schritt 'DWD-Karten herunterladen'."
          exit 1
