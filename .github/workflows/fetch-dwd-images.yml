name: DWD-Karten abrufen

# Taeglich 16:30 Ortszeit Berlin - ein Lauf fuer alle fuenf Karten.
# Das timezone-Feld ist offiziell unterstuetzt (IANA-String); GitHub
# handhabt damit die Sommer-/Winterzeit, ohne dass der Cron-Ausdruck
# zweimal im Jahr angefasst werden muss.
#
# workflow_dispatch bleibt zusaetzlich bestehen: manuelles Ausloesen ueber
# Actions-Tab -> "Run workflow" ist damit weiterhin jederzeit moeglich.
#
# Hinweis: GitHub garantiert die Startzeit nicht - bei hoher Last koennen
# geplante Laeufe verzoegert werden oder einzeln ausfallen.
on:
  schedule:
    - cron: '30 16 * * *'
      timezone: 'Europe/Berlin'
  workflow_dispatch:

# contents: der Workflow committet die Karten zurueck ins Repository.
# issues:   bei einem Fehlschlag wird ein Issue angelegt bzw. wieder geschlossen.
permissions:
  contents: write
  issues: write

# Zwei gleichzeitige Laeufe wuerden beim Pushen kollidieren.
concurrency:
  group: fetch-dwd-images
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Node einrichten
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Abhaengigkeiten installieren
        run: npm ci

      # continue-on-error, damit Teilerfolge unten trotzdem committet werden.
      # Der Lauf wird im letzten Schritt nachtraeglich rot markiert.
      - name: DWD-Karten herunterladen
        id: fetch
        continue-on-error: true
        run: npm run fetch:images

      - name: Neue Karten committen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/images
          if git diff --cached --quiet; then
            echo "Keine neuen Karten - nichts zu committen."
            exit 0
          fi

          anzahl=$(git diff --cached --name-only | wc -l | tr -d ' ')
          git commit -m "data: ${anzahl} DWD-Karte(n) vom $(date -u +%Y-%m-%d)"
          git push
          echo "${anzahl} Datei(en) committet."

      # Benachrichtigung ueber ein Issue statt nur per E-Mail: Ein Issue ist
      # sichtbar, ueberlebt einen uebersehenen Posteingang und erzeugt selbst
      # eine Benachrichtigung. Es bleibt bei EINEM offenen Issue - Folgefehler
      # werden nur auskommentiert, damit kein Issue-Spam entsteht.
      - name: Fehler melden
        if: steps.fetch.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create abruf-fehler \
            --color B60205 \
            --description "Automatischer DWD-Abruf fehlgeschlagen" \
            --force

          nummer=$(gh issue list --state open --label abruf-fehler --limit 1 --json number --jq '.[0].number // empty')

          if [ -n "$nummer" ]; then
            gh issue comment "$nummer" --body "Erneut fehlgeschlagen am $(date -u '+%Y-%m-%d %H:%M UTC').

Lauf: $RUN_URL"
            echo "Bestehendes Issue #${nummer} kommentiert."
          else
            gh issue create \
              --title "DWD-Abruf fehlgeschlagen" \
              --label abruf-fehler \
              --body "Der automatische Abruf der DWD-Karten ist fehlgeschlagen.

Erstmals am $(date -u '+%Y-%m-%d %H:%M UTC').
Lauf: $RUN_URL

Im Schritt \"DWD-Karten herunterladen\" steht, welche Karte betroffen ist.
Haeufigste Ursache: Der DWD hat eine Bild-URL geaendert - dann muss der
Eintrag in \`config/app-config.ts\` angepasst werden.

Dieses Issue schliesst sich automatisch, sobald ein Abruf wieder
vollstaendig durchlaeuft."
            echo "Neues Issue angelegt."
          fi

      # Selbstheilung: War der Abruf wieder vollstaendig erfolgreich, wird ein
      # offenes Fehler-Issue geschlossen. Ohne das bliebe es ewig stehen und
      # man wuesste nicht, ob das Problem noch besteht.
      - name: Offenes Fehler-Issue schliessen
        if: steps.fetch.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for n in $(gh issue list --state open --label abruf-fehler --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Abruf wieder vollstaendig erfolgreich.

Lauf: $RUN_URL"
            echo "Issue #${n} geschlossen."
          done

      - name: Lauf als fehlgeschlagen markieren, falls Karten fehlten
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "Mindestens eine Karte konnte nicht abgerufen werden - siehe Schritt 'DWD-Karten herunterladen'."
          exit 1
